# ============================================================
# Vision-Based Customer Trajectory Analytics — Configuration
# ============================================================

project:
  name: "Vision-Based Customer Trajectory Analytics"
  version: "0.4.0"
  phase: 4

paths:
  data_dir: "data/"
  output_dir: "outputs/"
  reports_dir: "outputs/reports/"
  database: "outputs/analytics.db"
  models_dir: "data/models/"

# Video Preprocessing & Quality Verification Settings
# NOTE: Quality thresholds are configurable engineering warning thresholds,
# NOT scientifically validated universal limits.
video:
  allowed_extensions:
    - ".mp4"
    - ".avi"
    - ".mov"
    - ".mkv"

  sampling:
    target_fps: 5.0              # Default frame sampling rate (FPS)
    max_sampled_frames: 300      # Safety cap for sampled frames per run

  quality_thresholds:
    min_width: 640               # Warning if width < 640px
    min_height: 480              # Warning if height < 480px
    min_fps: 10.0                # Warning if FPS < 10.0
    brightness:
      min_mean: 40.0             # Warning if mean brightness < 40 (too dark)
      max_mean: 230.0            # Warning if mean brightness > 230 (overexposed)
    sharpness:
      min_laplacian_var: 100.0   # Warning if Laplacian variance < 100 (blurry)

# YOLO11 Person Detection Settings (ONNX Runtime CPU Engine)
# NOTE: Confidence and IoU thresholds are configurable engineering parameters,
# NOT scientifically validated optimal values.
detection:
  model_path: "data/models/yolo11n.onnx"
  input_width: 640
  input_height: 640
  conf_threshold: 0.40           # Confidence score threshold for person filtering
  iou_threshold: 0.45            # Non-Maximum Suppression (NMS) IoU threshold
  target_class_id: 0             # COCO person class ID (0)
  target_class_name: "person"

# ByteTrack Multi-Object Tracking Settings
# NOTE: Track IDs are temporary session-local identifiers.
# There is NO re-identification or cross-session tracking.
tracking:
  track_high_thresh: 0.50        # High confidence threshold for 1st association
  track_low_thresh: 0.10         # Low confidence threshold for 2nd association
  new_track_thresh: 0.50         # Threshold to initialize new tracks
  match_thresh: 0.80             # Max IoU distance for 1st association (1 - IoU)
  low_match_thresh: 0.50         # Max IoU distance for 2nd association (1 - IoU)
  max_time_lost_sec: 2.0         # Max time (seconds) to keep a lost track before removal
